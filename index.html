<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="Cache-Control" content="no-cache">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jarvis">
<meta name="theme-color" content="#071018">
<title>Jarvis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#071018;--panel:#0e1b27;--line:#1c3345;--ink:#e6f3fb;--dim:#7f9bb0;--arc:#6fd3ff;--warn:#ffb454}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
h1{font:800 18px/1 Orbitron,"Arial Black",sans-serif;letter-spacing:.16em;margin:0}
header button{background:none;border:1px solid var(--line);color:var(--dim);border-radius:8px;padding:6px 10px;font-size:13px}
.brand{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.hbtns{display:flex;gap:6px;align-items:center}
.ttl{display:flex;align-items:center;gap:8px}
.mk{font:700 10px/1 Orbitron,"Arial Black",sans-serif;letter-spacing:.14em;color:var(--arc);border:1px solid rgba(111,211,255,.55);border-radius:4px;padding:3px 5px 3px 7px;opacity:.85}
.by{font:500 11px/1 Rajdhani,"Arial Narrow",sans-serif;letter-spacing:.08em;color:var(--dim);opacity:.45;white-space:normal;line-height:1.25}
#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px;-webkit-mask-image:linear-gradient(to bottom,transparent 0,rgba(0,0,0,.35) 5%,#000 13%);mask-image:linear-gradient(to bottom,transparent 0,rgba(0,0,0,.35) 5%,#000 13%)}
.msg{max-width:94%;padding:14px 16px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word}
.msg .body{white-space:normal}
.me{align-self:flex-end;background:rgba(28,51,69,.9)}
.ai{line-height:1.72;font-size:16.5px;align-self:flex-start;background:rgba(14,27,39,.88);border:1px solid var(--line)}
.src{display:block;color:var(--arc);font-size:13px;margin-top:6px;line-height:1.9}
.src a{color:var(--arc);text-decoration:underline;text-underline-offset:3px;padding:2px 0}
.sys{align-self:center;color:var(--dim);font-size:14px;text-align:center}
.alt{margin-top:8px;background:none;border:1px solid var(--warn);color:var(--warn);border-radius:8px;padding:5px 10px;font-size:14px}
#bar{display:flex;gap:6px;align-items:center;padding:8px 10px;border-top:1px solid var(--line)}
#txt{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:22px;padding:11px 16px;font-size:16px;outline:none}
#txt:focus{border-color:var(--arc)}
#send{width:42px;height:42px;flex:none;border-radius:50%;border:none;background:var(--arc);color:var(--bg);display:flex;align-items:center;justify-content:center;padding:0}
#mic{width:42px;height:42px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--ink);display:flex;align-items:center;justify-content:center;padding:0}
#mic.on{background:var(--arc);color:var(--bg);animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(111,211,255,.2)}}
@media (prefers-reduced-motion:reduce){#mic.on{animation:none}}
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:14px;width:min(92vw,420px)}
dialog label{display:block;margin:10px 0 4px;color:var(--dim);font-size:14px}
dialog input,dialog select{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:9px;font-size:16px}
dialog .row{display:flex;gap:8px;margin-top:16px}
dialog button{flex:1;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:16px}
dialog button.go{background:var(--arc);color:var(--bg);border-color:var(--arc)}
dialog p{font-size:13px;color:var(--dim);margin:12px 0 0}
#hud,#hudt{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
#hud{filter:blur(2.5px)}
.msg{-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
header,#log,#bar{position:relative;z-index:1}
#vm{position:fixed;inset:0;z-index:5;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(7,16,24,.28)}
#vm.open{display:flex}
#vmx{position:absolute;top:calc(14px + env(safe-area-inset-top));right:16px;background:none;border:1px solid var(--line);color:var(--dim);width:38px;height:38px;border-radius:50%;font-size:16px}
#vmic{--lvl:0;width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-top:min(36vh,300px);background:rgba(14,27,39,.55);border:1.5px solid var(--arc);color:var(--arc);transition:box-shadow .08s,background .2s,color .2s,border-color .2s;box-shadow:0 0 calc(10px + var(--lvl) * 46px) rgba(111,211,255,calc(.25 + var(--lvl) * .6))}
#vm.hear #vmic{background:var(--arc);color:var(--bg)}
#vm.think #vmic{border-color:var(--warn);color:var(--warn);box-shadow:0 0 26px rgba(255,180,84,.45)}
#vm.speak #vmic{box-shadow:0 0 calc(14px + var(--lvl) * 40px) rgba(111,211,255,.75)}
#vmic{display:none}
body.live #bar{z-index:6}
#wf{display:none;flex:1;min-width:0;height:36px}
body.live #wf{display:block}
body.live #txt{display:none}
#vmt{margin-top:min(36vh,300px);color:var(--dim);font:600 14px/1 Rajdhani,sans-serif;letter-spacing:.2em;text-transform:uppercase}
.pics{display:flex;gap:6px;margin-top:8px;overflow-x:auto}
.pics img{height:96px;width:auto;max-width:180px;object-fit:cover;border-radius:8px;border:1px solid var(--line);flex:none;cursor:pointer}
.pics-src{display:block;color:var(--dim);font-size:12px;margin-top:4px}
.gimg{display:inline-block;margin-top:8px;color:var(--arc);font-size:14px;border:1px solid var(--line);border-radius:8px;padding:5px 10px;text-decoration:none}
#lb{position:fixed;inset:0;z-index:9;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(3,8,13,.92);padding:16px}
#lb.open{display:flex}
#lb img{max-width:96vw;max-height:78vh;border-radius:10px}
#lb span{color:var(--dim);font-size:13px;margin-top:10px;text-align:center}
#clip{width:42px;height:42px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--ink);display:flex;align-items:center;justify-content:center;padding:0}
#att{display:none;align-items:center;gap:10px;padding:6px 14px;border-top:1px solid var(--line);position:relative;z-index:1;background:rgba(7,16,24,.7)}
#att.on{display:flex}
#att img{height:46px;width:46px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
#att span{flex:1;color:var(--dim);font-size:13px}
#att button{background:none;border:1px solid var(--line);color:var(--dim);border-radius:50%;width:30px;height:30px}
#simple{background:none;border:1px solid var(--line);color:var(--dim);border-radius:8px;padding:6px 10px;font-size:13px;flex:none}
#simple.on{border-color:var(--arc);color:var(--arc)}
body.drag #log{outline:2px dashed var(--arc);outline-offset:-8px}
.body .p{margin:0 0 18px}
.body .p:last-child{margin-bottom:0}
.body .h{font-weight:650;color:#fff;font-size:1.06em;margin:24px 0 10px;padding-left:10px;border-left:2px solid var(--arc);line-height:1.3}
.body .h:first-child{margin-top:0}
.body .q{margin:18px 0 0;padding:10px 12px;border-radius:8px;background:rgba(111,211,255,.07);border-left:2px solid var(--arc);line-height:1.5}
.body .li.sub{margin:-8px 0 14px 26px;font-size:.95em;color:var(--dim)}
.body .tw{overflow-x:auto;margin:0 0 18px;-webkit-overflow-scrolling:touch}
.body table{border-collapse:collapse;font-size:14px;min-width:100%}
.body th,.body td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.body th{color:#fff;background:rgba(111,211,255,.09);font-weight:600}
.body .li{display:flex;gap:12px;margin:0 0 20px;align-items:flex-start}
.body .li:last-child{margin-bottom:0}
.body .li .n{color:var(--arc);font-weight:600;flex:none;min-width:1.7em}
.body .li .t{flex:1;min-width:0}
.body .li b{font-weight:600;color:#fff}
.body .li .t .il{display:block;margin-top:6px;font-size:13px;color:var(--arc);text-decoration:underline;text-underline-offset:3px;word-break:break-word;padding:3px 0}
.srcs{margin-top:18px;padding-top:12px;border-top:1px solid var(--line);font-size:13px}
.srcs .h{color:var(--dim);font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px}
.srcs a{display:block;color:var(--arc);text-decoration:underline;text-underline-offset:3px;padding:6px 0;word-break:break-word}
#log > :first-child{margin-top:auto}
.status{align-self:flex-start;display:flex;align-items:center;gap:10px;color:var(--dim);font-size:14px;padding:2px 6px}
.status i{position:relative;flex:none;width:24px;height:24px;border-radius:50%;background:radial-gradient(circle,#fff 0 9%,var(--arc) 24%,rgba(111,211,255,.22) 50%,transparent 54%);box-shadow:0 0 8px rgba(111,211,255,.5);animation:arcb 1.3s ease-in-out infinite}
.status i::before{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(var(--arc) 0 16deg,transparent 16deg 40deg);-webkit-mask:radial-gradient(circle,transparent 56%,#000 60%,#000 80%,transparent 84%);mask:radial-gradient(circle,transparent 56%,#000 60%,#000 80%,transparent 84%);opacity:.85;animation:arcs 3.2s linear infinite}
.status i::after{content:"";position:absolute;inset:0;border-radius:50%;border:1px solid var(--arc);opacity:.55}
.status span{background:linear-gradient(90deg,var(--dim) 0 38%,#eaf7ff 50%,var(--dim) 62% 100%);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:shim 1.9s linear infinite}
@keyframes arcb{0%,100%{opacity:.55;box-shadow:0 0 4px rgba(111,211,255,.35)}50%{opacity:1;box-shadow:0 0 16px rgba(111,211,255,.85)}}
@keyframes arcs{to{transform:rotate(360deg)}}
@keyframes shim{from{background-position:130% 0}to{background-position:-130% 0}}
@keyframes blink{50%{opacity:.25;transform:scale(.7)}}
@media (prefers-reduced-motion:reduce){.status i,.status i::before,.status span{animation:none}.status span{-webkit-text-fill-color:currentColor;color:var(--dim)}}
.body b{font-weight:650;color:#fff}
.body a.lnk{color:var(--arc);text-decoration:underline;text-underline-offset:3px;word-break:break-all}
.body a.map{color:var(--arc);text-decoration:underline;text-underline-offset:3px;font-weight:600}
.srcs .qs{color:var(--dim);font-size:12px;line-height:1.5;padding:2px 0 8px}
.srcs .tg{background:none;border:1px solid var(--line);color:var(--arc);border-radius:14px;padding:6px 12px;font-size:13px}
.srcs div a{display:block;color:var(--arc);text-decoration:underline;text-underline-offset:3px;padding:7px 0;word-break:break-word;font-size:14px}
</style>
</head>
<body>
<canvas id="hud" aria-hidden="true"></canvas>
<canvas id="hudt" aria-hidden="true"></canvas>
<div id="lb"><img alt=""><span></span></div>
<div id="vm" aria-label="Voice mode"><button id="vmx" aria-label="Close voice mode">&#10005;</button><div id="vmic"><svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg></div><div id="vmt">Listening</div></div>
<header><div class="brand"><div class="ttl"><h1>JARVIS</h1><span class="mk">MK I</span></div><span class="by">by DMS (last update: November 15, 2026)</span></div><div class="hbtns"><button id="simple" aria-pressed="false">Simple: off</button><button id="cfg">Settings</button></div></header>
<main id="log" aria-live="polite"></main>
<div id="att"><img alt=""><span>Picture attached</span><button id="attx" aria-label="Remove picture">&#10005;</button></div>
<div id="bar">
  <button id="clip" aria-label="Attach a picture"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5l-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l8.6-8.6a3.7 3.7 0 0 1 5.2 5.2l-8.6 8.6a1.8 1.8 0 0 1-2.6-2.6l7.9-7.9"/></svg></button>
  <input id="file" type="file" accept="image/*" hidden>
  <input id="txt" placeholder="Ask Jarvis…" autocomplete="off"><canvas id="wf" aria-hidden="true"></canvas>
  <button id="mic" aria-label="Speak"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg></button>
  <button id="send" aria-label="Send"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg></button>
</div>

<dialog id="dlg">
  <strong>Settings</strong> <span style="color:var(--dim);font-size:12px">build 15 Nov · g</span>
  <label for="gk">Gemini API key</label><input id="gk" type="password" autocomplete="off">
  <label for="ok">OpenAI API key</label><input id="ok" type="password" autocomplete="off">
  <label for="gm">Gemini model</label><input id="gm" value="gemini-3.5-flash-lite">
  <label for="vi">Voice input</label><select id="vi"><option value="acc">Accurate: any language, via Gemini</option><option value="dev">Device: instant, English only</option></select>
  <label for="rm">Strong model (rechecks and hard questions, small free limit)</label><input id="rm" value="gemini-3.6-flash">
  <label for="dp">Research depth</label><select id="dp"><option value="deep">Thorough: search deeper, slower</option><option value="fast">Fast: quick answers</option></select>
  <label for="om">OpenAI model</label><input id="om" value="gpt-4o-mini">
  <label for="ik">Google Images key (optional)</label><input id="ik" type="password" autocomplete="off">
  <label for="ic">Google search engine ID (optional)</label><input id="ic" autocomplete="off">
  <label for="mem">Memory (one fact per line)</label><textarea id="mem" rows="4" style="width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:9px;font-size:15px"></textarea>
  <label for="rd">Reading aloud</label><select id="rd"><option value="short">Short: the first part only</option><option value="full">Full answer</option></select>
  <label for="md">Answer mode</label><select id="md"><option value="fast">Fast: Gemini first, ChatGPT if not convinced</option><option value="best">Best of both (slower)</option></select>
  <label for="vc">Voice</label><select id="vc"></select>
  <div class="row"><button id="test">Test voice</button><button id="diag">Test connection</button></div>
  <div class="row"><button id="loc">Allow location</button></div>
  <p>Keys are stored only in this browser on your phone. They are never placed in the page’s code.</p>
  <div class="row"><button id="cancel">Close</button><button id="save" class="go">Save</button></div>
</dialog>

<script>
const $ = id => document.getElementById(id);
const log = $('log'), txt = $('txt'), dlg = $('dlg');
const store = {
  get(k, d){ try { return localStorage.getItem(k) || d } catch(e){ return d } },
  set(k, v){ try { localStorage.setItem(k, v) } catch(e){} }
};
const cfg = () => ({ gk: store.get('gk',''), ok: store.get('ok',''), gm: (g => (!g || /^gemini-2\./.test(g)) ? 'gemini-3.5-flash-lite' : g)(store.get('gm','')), om: store.get('om','gpt-4o-mini'), rm: store.get('rm','') || 'gemini-3.6-flash' });
let manualScroll = false;
log.addEventListener('touchmove', () => { manualScroll = true; }, { passive:true });
log.addEventListener('wheel', () => { manualScroll = true; }, { passive:true });
function followAnswer(el){
  if (manualScroll || !el) return;
  const max = log.scrollHeight - log.clientHeight;
  const gap = Math.round(log.clientHeight * .16);
  log.scrollTop = Math.max(0, Math.min(max, el.offsetTop - gap));
}
let history = (() => { try { return JSON.parse(store.get('hist','[]')).slice(-12); } catch(e){ return []; } })();
function saveHist(){ store.set('hist', JSON.stringify(history.slice(-12))); }

function linkText(parent, str){
  const re = /https?:\/\/[^\s)\]}>"']+/g;
  let last = 0, m;
  while ((m = re.exec(str))){
    const url = m[0].replace(/[.,;:!?]+$/, '');
    if (m.index > last) parent.appendChild(document.createTextNode(str.slice(last, m.index)));
    const a = document.createElement('a'); a.className = 'lnk'; a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer';
    a.textContent = url.replace(/^https?:\/\/(www\.)?/, '').slice(0, 48) + (url.length > 56 ? '\u2026' : '');
    parent.appendChild(a);
    last = m.index + url.length; re.lastIndex = last;
  }
  if (last < str.length) parent.appendChild(document.createTextNode(str.slice(last)));
}
function inline(parent, str){
  if ((str.match(/\*\*/g) || []).length % 2) str = str.replace(/\*\*(?!.*\*\*)/, '');
  const ob = str.lastIndexOf('[['); if (ob > str.lastIndexOf(']]')) str = str.slice(0, ob);
  str = str.replace(/\[[^\]\[]*\]\([^)]*$/, '');
  const re = /\*\*([^*]+?)\*\*|\[\[([^\]]+?)\]\]|\[([^\]\[]+?)\]\((https?:\/\/[^\s)]+)\)/g;
  let last = 0, m;
  while ((m = re.exec(str))){
    if (m.index > last) linkText(parent, str.slice(last, m.index));
    if (m[1] !== undefined){ const b = document.createElement('b'); inline(b, m[1]); parent.appendChild(b); }
    else if (m[3] !== undefined){ const a = document.createElement('a'); a.className = 'lnk'; a.href = m[4]; a.target = '_blank'; a.rel = 'noopener noreferrer'; a.textContent = m[3]; parent.appendChild(a); }
    else if (/https?:\/\/|\b[a-z0-9-]+\.(?:com|org|net|de|ph|uk|io|co|edu|gov|app|shop|store)\b/i.test(m[2])){
      const parts = m[2].split('|').map(x => x.trim()).filter(Boolean);
      let url = parts.find(x => /^https?:\/\//i.test(x)) || parts.find(x => /\.[a-z]{2,}(\/|$)/i.test(x)) || parts[0];
      const label = parts.find(x => x !== url) || url.replace(/^https?:\/\/(www\.)?/, '').replace(/\/$/, '');
      if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
      const a = document.createElement('a'); a.className = 'lnk'; a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer'; a.textContent = label;
      parent.appendChild(a);
    }
    else {
      const a = document.createElement('a'); a.className = 'map';
      a.href = 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(m[2]);
      a.target = '_blank'; a.rel = 'noopener noreferrer'; a.textContent = '\u{1F4CD} ' + m[2];
      parent.appendChild(a);
    }
    last = re.lastIndex;
  }
  if (last < str.length) linkText(parent, str.slice(last));
}
function renderText(box, text, linksFn){
  box.textContent = '';
  let pos = 0, linked = 0, tbl = null;
  const flushT = () => {
    if (!tbl) return;
    const rows = tbl.filter(r => !r.every(c => /^:?-{2,}:?$/.test(c)));
    const w = document.createElement('div'); w.className = 'tw';
    const t = document.createElement('table');
    rows.forEach((r, ri) => { const tr = document.createElement('tr'); r.forEach(c => { const td = document.createElement(ri === 0 ? 'th' : 'td'); inline(td, c); tr.appendChild(td); }); t.appendChild(tr); });
    w.appendChild(t); box.appendChild(w); tbl = null;
  };
  String(text).split('\n').forEach(raw => {
    const a = pos, b = pos + raw.length; pos = b + 1;
    const trimmed = raw.trim();
    if (/^\|.*\|?$/.test(trimmed) && trimmed.indexOf('|', 1) > 0){
      (tbl = tbl || []).push(trimmed.replace(/^\||\|$/g, '').split('|').map(c => c.trim())); return;
    }
    flushT();
    if (!trimmed || /^[-*_]{3,}$/.test(trimmed)) return;
    const hm = trimmed.match(/^#{1,4}\s+(.*)$/);
    if (hm){ const h = document.createElement('div'); h.className = 'h'; inline(h, hm[1].replace(/\*\*/g, '')); box.appendChild(h); return; }
    const qm = trimmed.match(/^>\s?(.*)$/);
    if (qm){ const q = document.createElement('div'); q.className = 'q'; inline(q, qm[1]); box.appendChild(q); return; }
    const line = trimmed;
    const m = line.match(/^(\d+[.)]|[-•*])\s+(.*)$/);
    if (m){
      const row = document.createElement('div'); row.className = 'li';
      if (/^\s{2,}|^\t/.test(raw) && /^\s*[-•*]/.test(raw)) row.classList.add('sub');
      const n = document.createElement('span'); n.className = 'n'; n.textContent = /^\d/.test(m[1]) ? m[1] : '•';

$('save').onclick = () => { store.set('gk', $('gk').value.trim()); store.set('ok', $('ok').value.trim()); store.set('gm', $('gm').value.trim()); store.set('om', $('om').value.trim()); store.set('rm', $('rm').value.trim()); store.set('vin', $('vi').value); window._recFailUntil = 0; store.set('depth', $('dp').value); store.set('voice', $('vc').value); store.set('mode', $('md').value); store.set('read2', $('rd').value); store.set('ik', $('ik').value.trim()); store.set('ic', $('ic').value.trim()); saveFacts($('mem').value.split('\n').map(x => x.trim()).filter(Boolean)); dlg.close(); add('sys', 'Settings saved.'); checkKey(); };

/* ---------- Living background ---------- */
(function(){
  const cv = $('hud'), g = cv.getContext('2d'), cv2 = $('hudt'), h = cv2.getContext('2d');
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W = 0, H = 0;
  function size(){ const d = Math.min(window.devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; cv.width = cv2.width = W * d; cv.height = cv2.height = H * d; g.setTransform(d, 0, 0, d, 0, 0); h.setTransform(d, 0, 0, d, 0, 0); if (still) frame(2000); }
  const parts = Array.from({ length: 12 }, () => ({ r: .37 + Math.random() * .57, a: Math.random() * 6.283, v: (.15 + Math.random() * .5) * (Math.random() < .5 ? -1 : 1), s: .8 + Math.random() * 1.8, p: Math.random() * 6 }));
  const ripples = [];
  const bok = Array.from({ length: 14 }, () => ({ x: Math.random(), y: Math.random(), vx: (Math.random() - .5) * .012, vy: (Math.random() - .5) * .01, r: .05 + Math.random() * .14, a: .07 + Math.random() * .11, p: Math.random() * 6.283 }));
  let memN = 0, memT = -9;
  let warm = 0, voiceAmt = 0, e = .14, col = [111, 211, 255], last = 0, rip = 0, spin = 0, envT = 0;
  let env = [.5, .5, .5], envG = [.5, .5, .5];
  const rgba = a => 'rgba(' + (col[0] | 0) + ',' + (col[1] | 0) + ',' + (col[2] | 0) + ',' + a + ')';

  function frame(ms){
    const t = ms / 1000, dt = Math.min(.05, t - last) || .016; last = t;
    const talking = document.body.classList.contains('talk'), thinking = busy && !talking;
    e += ((talking ? 1 : thinking ? .65 : live ? .4 : .14) - e) * Math.min(1, dt * 3);
    const tc = thinking ? [255, 180, 84] : [111, 211, 255];
    for (let i = 0; i < 3; i++) col[i] += (tc[i] - col[i]) * Math.min(1, dt * 3);
    warm += ((thinking ? 1 : 0) - warm) * Math.min(1, dt * 3);
    voiceAmt += (((talking || live) ? 1 : 0) - voiceAmt) * Math.min(1, dt * 4);
    spin += dt * (.1 + e * .5);
    envT += dt;
    if (envT > .09){ envT = 0; envG = envG.map(() => talking ? Math.random() : .5 + Math.random() * .3); }
    env = env.map((v, i) => v + (envG[i] - v) * Math.min(1, dt * 14));

    const cx = W / 2, cy = H * .47, S = Math.min(H * .46, W * .8), TAU = Math.PI * 2;
    g.clearRect(0, 0, W, H);
    g.globalCompositeOperation = 'lighter';
    g.lineCap = 'round';

    // drifting bokeh orbs
    bok.forEach(b => {
      const x = ((b.x + t * b.vx) % 1 + 1) % 1 * W, y = ((b.y + t * b.vy) % 1 + 1) % 1 * H;
      const rr = S * b.r * (1 + .12 * Math.sin(t * .5 + b.p)), a = b.a * (.65 + .35 * Math.sin(t * .7 + b.p)) * (.7 + e * .6);
      const gg = g.createRadialGradient(x, y, 0, x, y, rr);
      gg.addColorStop(0, rgba(a)); gg.addColorStop(1, rgba(0));
      g.fillStyle = gg; g.beginPath(); g.arc(x, y, rr, 0, TAU); g.fill();
    });

    // core glow
    const pulse = 1 + Math.sin(t * (1.6 + e * 4)) * .07 * (.5 + e);
    const gr = g.createRadialGradient(cx, cy, 0, cx, cy, S * .32 * pulse);
    gr.addColorStop(0, rgba(.3 * (.5 + e * .5))); gr.addColorStop(1, rgba(0));
    g.fillStyle = gr; g.beginPath(); g.arc(cx, cy, S * .32 * pulse, 0, TAU); g.fill();

    // steady orb: Siri-style fluid core inside an arc-reactor frame
    const oR = S * .3, mix = c => [c[0] + (255 - c[0]) * warm, c[1] + (150 - c[1]) * warm, c[2] + (50 - c[2]) * warm].map(Math.round);
    g.save();
    g.beginPath(); g.arc(cx, cy, oR * .8, 0, TAU); g.clip();
    g.globalCompositeOperation = 'source-over';
    g.fillStyle = 'rgba(4,12,22,.92)'; g.fillRect(cx - oR, cy - oR, oR * 2, oR * 2);
    g.globalCompositeOperation = 'lighter';
    [[[90, 220, 255], .25, 0, .22, .18, .7], [[110, 150, 255], -.2, 3, .2, .2, .6]].forEach(([c, sp, ph, rx, ry, sz]) => {
      const cc = mix(c), x = cx + Math.cos(t * sp + ph) * oR * rx, y = cy + Math.sin(t * sp * 1.2 + ph) * oR * ry, rad = oR * sz;
      const bg = g.createRadialGradient(x, y, 0, x, y, rad);
      bg.addColorStop(0, 'rgba(' + cc + ',' + (.45 + .1 * voiceAmt) + ')'); bg.addColorStop(1, 'rgba(' + cc + ',0)');
      g.fillStyle = bg; g.beginPath(); g.arc(x, y, rad, 0, TAU); g.fill();
    });
    // subtle waveform, only visible while someone speaks
    if (voiceAmt > .01){
      const lv = talking ? .3 + .7 * env[0] : Math.min(1, Math.max(0, lvl - .06) * 2.1), sv = talking ? 1.9 : 1 + lv * 1.2, amp = oR * (.015 + .42 * lv) * voiceAmt * (talking ? 1 + .22 * Math.sin(t * 9) : 1), wl = [[.55, 3, 1.1, .8], [.4, 5, -1.6, .45], [.3, 8, 2.2, .3]];
      wl.forEach(([w, f, sp, al], k) => {
        g.beginPath();
        for (let i = 0; i <= 60; i++){
          const u = i / 60, x = cx - oR * .72 + u * oR * 1.44, tap = Math.sin(u * Math.PI);
          const y = cy + (Math.sin(u * TAU * f * .5 + t * sp * 3 * sv + k) + .35 * Math.sin(u * TAU * f * .8 - t * sp * 4.5 * sv)) * amp * w * tap * (.55 + .5 * env[(k + 1) % 3]);
          i ? g.lineTo(x, y) : g.moveTo(x, y);
        }
        g.lineWidth = 2 - k * .6; g.strokeStyle = 'rgba(255,255,255,' + (Math.min(1, al * (.5 + .7 * lv)) * voiceAmt) + ')'; g.stroke();
      });
    }
    const hl = g.createRadialGradient(cx, cy, 0, cx, cy, oR * .3);
    hl.addColorStop(0, 'rgba(255,255,255,' + (.36 + .1 * voiceAmt + .04 * Math.sin(t * 2)) + ')'); hl.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = hl; g.beginPath(); g.arc(cx, cy, oR * .3, 0, TAU); g.fill();
    g.restore();
    g.lineCap = 'butt'; g.lineWidth = oR * .1; g.strokeStyle = rgba(.4);
    for (let j = 0; j < 10; j++){ const st = spin * .04 + j * TAU / 10; g.beginPath(); g.arc(cx, cy, oR * .9, st, st + TAU / 10 * .7); g.stroke(); }
    g.lineCap = 'round';
    g.lineWidth = 2; g.strokeStyle = rgba(.75); g.beginPath(); g.arc(cx, cy, oR * .8, 0, TAU); g.stroke();
    g.lineWidth = 2.5; g.strokeStyle = rgba(.9); g.beginPath(); g.arc(cx, cy, oR, 0, TAU); g.stroke();
    g.lineWidth = 1; g.strokeStyle = rgba(.35); g.beginPath(); g.arc(cx, cy, oR * 1.14, 0, TAU); g.stroke();

    // rotating arc rings
    [[.62, 3, .5, 1.5, .5], [.78, 2, -.3, 1.2, .4]].forEach(([rad, k, sp, w, al]) => {
      g.lineWidth = w; g.strokeStyle = rgba(al * .35 * (.6 + e * .4));
      for (let j = 0; j < k; j++){
        const st = spin * sp + j * TAU / k;
        g.beginPath(); g.arc(cx, cy, S * rad, st, st + TAU / k * .55); g.stroke();
      }
    });

    // orbiting particles
    parts.forEach(p => {
      p.a += p.v * dt * (1 + e * 2.2);
      const rr = S * p.r * (1 + .03 * Math.sin(t + p.p)), sg = Math.sign(p.v);
      g.lineWidth = .8; g.strokeStyle = rgba(.12);
      g.beginPath(); g.arc(cx, cy, rr, p.a - sg * .14, p.a, sg < 0); g.stroke();
      g.fillStyle = rgba(.4); g.beginPath(); g.arc(cx + Math.cos(p.a) * rr, cy + Math.sin(p.a) * rr, p.s, 0, TAU); g.fill();
    });

    // ripples from the core
    rip += dt;
    if (rip > (talking ? 1.4 : thinking ? 2.2 : live ? 4 : 8)){ rip = 0; ripples.push({ r: S * .34, a: .22 }); }
    for (let i = ripples.length - 1; i >= 0; i--){
      const q = ripples[i]; q.r += dt * S * (.5 + e * .5); q.a -= dt * .35;
      if (q.a <= 0 || q.r > S * 1.1){ ripples.splice(i, 1); continue; }
      g.lineWidth = 1; g.strokeStyle = rgba(q.a); g.beginPath(); g.arc(cx, cy, q.r, 0, TAU); g.stroke();
    }

    // title and meaning of the name, above the orb
    {
      h.clearRect(0, 0, W, H);
      h.globalCompositeOperation = 'source-over';
      {
        h.font = '9px "Courier New", monospace'; h.textAlign = 'center';
        const cols = [10, 23, W - 23, W - 10], rows = Math.ceil(H / 11), glyph = '01ABCDEF<>/{}=+';
        cols.forEach((x, ci) => {
          const head = (t * (5 + ci * 1.7) + ci * 13) % (rows + 16);
          for (let k = 0; k < 16; k++){
            const row = Math.floor(head) - k; if (row < 0 || row > rows) continue;
            const ch = glyph[Math.floor(row * 7 + ci * 3 + Math.floor(t * (k ? 1 : 6))) % glyph.length];
            h.fillStyle = rgba(k ? .2 * (1 - k / 16) : .55);
            h.fillText(ch, x, row * 11);
          }
        });
        if (t - memT > 2){ memT = t; memN = facts().length; }
        const st = talking ? 'SPEAKING' : thinking ? 'THINKING' : live ? 'LISTENING' : 'STANDBY';
        [[14, cy - S * .62, 'left', 'SYSTEM', st], [W - 14, cy - S * .62, 'right', 'CLOCK', new Date().toLocaleTimeString('en-GB'), new Date().toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short', year:'numeric' }).toUpperCase().replace(/,/g, '')],
         [14, cy + S * .5, 'left', 'MEMORY', memN + ' FACTS'], [W - 14, cy + S * .5, 'right', 'NETWORK', navigator.onLine ? 'ONLINE' : 'OFFLINE']].forEach(([x, y, al, lab, val, sub]) => {
          h.textAlign = al;
          h.font = '600 9px Rajdhani, "Courier New", monospace'; h.fillStyle = rgba(.2); h.fillText(lab, x, y);
          h.font = '700 12px Rajdhani, "Courier New", monospace'; h.fillStyle = rgba(.42); h.fillText(val, x, y + 13);
          if (sub){ h.font = '600 10px Rajdhani, "Courier New", monospace'; h.fillStyle = rgba(.3); h.fillText(sub, x, y + 25); }
        });
      }
      h.textAlign = 'center'; h.textBaseline = 'alphabetic';
      h.save();
      h.shadowColor = rgba(.8); h.shadowBlur = 12 + e * 10;
      h.fillStyle = 'rgba(230,243,251,.95)';
      h.font = '800 ' + Math.round(S * .07) + 'px Orbitron, "Arial Black", sans-serif';
      try { h.letterSpacing = Math.round(S * .012) + 'px'; } catch (_) {}
      h.fillText('JARVIS', cx, cy - S * .455);
      h.restore();

      h.save();
      h.textAlign = 'left';
      const fs = Math.round(S * .036), gap = fs * .45;
      const fb = '700 ' + fs + 'px Rajdhani, "Arial Narrow", sans-serif', fn = '500 ' + fs + 'px Rajdhani, "Arial Narrow", sans-serif';
      let total = gap * 5;
      const segs = [['J', 'ust'], ['A', ''], ['R', 'ather'], ['V', 'ery'], ['I', 'ntelligent'], ['S', 'ystem']].map(([a, b]) => {
        h.font = fb; const wa = h.measureText(a).width; h.font = fn; const wb = h.measureText(b).width;
        total += wa + wb; return [a, b, wa, wb];
      });
      let tx = cx - total / 2;
      const ty = cy - S * .395;
      segs.forEach(([a, b, wa, wb]) => {
        h.font = fb; h.fillStyle = rgba(1); h.fillText(a, tx, ty);
        h.font = fn; h.fillStyle = 'rgba(200,225,240,.8)'; h.fillText(b, tx + wa, ty);
        tx += wa + wb + gap;
      });
      h.restore();
    }

    if (!still) requestAnimationFrame(frame);
  }
  if (document.fonts) Promise.all([document.fonts.load('800 20px Orbitron'), document.fonts.load('700 20px Rajdhani'), document.fonts.load('500 20px Rajdhani')]).then(() => { if (still) frame(2000); }).catch(() => {});
  addEventListener('resize', size);
  size();
  if (!still) requestAnimationFrame(frame);
})();

add('ai', 'Good day, sir. Jarvis is online.');
</script>

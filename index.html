<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jarvis">
<meta name="theme-color" content="#071018">
<title>Jarvis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#071018;--panel:#0e1b27;--line:#1c3345;--ink:#e6f3fb;--dim:#7f9bb0;--arc:#6fd3ff;--warn:#ffb454}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
h1{font:800 18px/1 Orbitron,"Arial Black",sans-serif;letter-spacing:.16em;margin:0}
header button{background:none;border:1px solid var(--line);color:var(--dim);border-radius:8px;padding:6px 12px;font-size:14px}
.brand{display:flex;flex-direction:column;gap:4px}
.by{font:500 11px/1 Rajdhani,"Arial Narrow",sans-serif;letter-spacing:.14em;color:var(--dim);opacity:.45}
#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:86%;padding:10px 14px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word}
.me{align-self:flex-end;background:rgba(28,51,69,.9)}
.ai{align-self:flex-start;background:rgba(14,27,39,.88);border:1px solid var(--line)}
.src{display:block;color:var(--arc);font-size:13px;margin-top:6px}
.sys{align-self:center;color:var(--dim);font-size:14px;text-align:center}
.alt{margin-top:8px;background:none;border:1px solid var(--warn);color:var(--warn);border-radius:8px;padding:5px 10px;font-size:14px}
#bar{display:flex;gap:8px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
#txt{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:22px;padding:11px 16px;font-size:16px;outline:none}
#txt:focus{border-color:var(--arc)}
#send{background:none;border:none;color:var(--arc);font-size:16px;padding:8px 6px;flex:none}
#mic{width:42px;height:42px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--ink);display:flex;align-items:center;justify-content:center;padding:0}
#mic.on{background:var(--arc);color:var(--bg);animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(111,211,255,.2)}}
@media (prefers-reduced-motion:reduce){#mic.on{animation:none}}
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:14px;width:min(92vw,420px)}
dialog label{display:block;margin:10px 0 4px;color:var(--dim);font-size:14px}
dialog input,dialog select{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:9px;font-size:16px}
dialog .row{display:flex;gap:8px;margin-top:16px}
dialog button{flex:1;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:16px}
dialog button.go{background:var(--arc);color:var(--bg);border-color:var(--arc)}
dialog p{font-size:13px;color:var(--dim);margin:12px 0 0}
#hud,#hudt{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
#hud{filter:blur(2.5px)}
.msg{-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
header,#log,#bar{position:relative;z-index:1}
#vm{position:fixed;inset:0;z-index:5;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(7,16,24,.28)}
#vm.open{display:flex}
#vmx{position:absolute;top:calc(14px + env(safe-area-inset-top));right:16px;background:none;border:1px solid var(--line);color:var(--dim);width:38px;height:38px;border-radius:50%;font-size:16px}
#vmic{--lvl:0;width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-top:min(36vh,300px);background:rgba(14,27,39,.55);border:1.5px solid var(--arc);color:var(--arc);transition:box-shadow .08s,background .2s,color .2s,border-color .2s;box-shadow:0 0 calc(10px + var(--lvl) * 46px) rgba(111,211,255,calc(.25 + var(--lvl) * .6))}
#vm.hear #vmic{background:var(--arc);color:var(--bg)}
#vm.think #vmic{border-color:var(--warn);color:var(--warn);box-shadow:0 0 26px rgba(255,180,84,.45)}
#vm.speak #vmic{box-shadow:0 0 calc(14px + var(--lvl) * 40px) rgba(111,211,255,.75)}
#vmt{margin-top:14px;color:var(--dim);font:600 14px/1 Rajdhani,sans-serif;letter-spacing:.2em;text-transform:uppercase}
</style>
</head>
<body>
<canvas id="hud" aria-hidden="true"></canvas>
<canvas id="hudt" aria-hidden="true"></canvas>
<div id="vm" aria-label="Voice mode"><button id="vmx" aria-label="Close voice mode">&#10005;</button><div id="vmic"><svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg></div><div id="vmt">Listening</div></div>
<header><div class="brand"><h1>JARVIS</h1><span class="by">by DMS (last update: November 14, 2026)</span></div><button id="cfg">Settings</button></header>
<main id="log" aria-live="polite"></main>
<div id="bar">
  <input id="txt" placeholder="Ask Jarvis, or say “remind me in 10 minutes to…”" autocomplete="off">
  <button id="mic" aria-label="Speak"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg></button>
  <button id="send">Send</button>
</div>

<dialog id="dlg">
  <strong>Settings</strong>
  <label for="gk">Gemini API key</label><input id="gk" type="password" autocomplete="off">
  <label for="ok">OpenAI API key</label><input id="ok" type="password" autocomplete="off">
  <label for="gm">Gemini model</label><input id="gm" value="gemini-3.5-flash-lite">
  <label for="om">OpenAI model</label><input id="om" value="gpt-4o-mini">
  <label for="mem">Memory (one fact per line)</label><textarea id="mem" rows="4" style="width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:9px;font-size:15px"></textarea>
  <label for="md">Answer mode</label><select id="md"><option value="fast">Fast: Gemini first, ChatGPT if not convinced</option><option value="best">Best of both (slower)</option></select>
  <label for="vc">Voice</label><select id="vc"></select>
  <div class="row"><button id="test">Test voice</button></div>
  <p>Keys are stored only in this browser on your phone. They are never placed in the page’s code.</p>
  <div class="row"><button id="cancel">Close</button><button id="save" class="go">Save</button></div>
</dialog>

<script>
const $ = id => document.getElementById(id);
const log = $('log'), txt = $('txt'), dlg = $('dlg');
const store = {
  get(k, d){ try { return localStorage.getItem(k) || d } catch(e){ return d } },
  set(k, v){ try { localStorage.setItem(k, v) } catch(e){} }
};
const cfg = () => ({ gk: store.get('gk',''), ok: store.get('ok',''), gm: (g => (!g || /^gemini-2\./.test(g)) ? 'gemini-3.5-flash-lite' : g)(store.get('gm','')), om: store.get('om','gpt-4o-mini') });
let history = [];

function add(cls, text, source){
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  if (source){ const s = document.createElement('span'); s.className = 'src'; s.textContent = 'Answered by ' + source; d.appendChild(s); }
  log.appendChild(d); log.scrollTop = log.scrollHeight;
  return d;
}
function pickVoice(){
  const all = voices(), saved = store.get('voice','');
  return all.find(x => x.voiceURI === saved) || all.find(x => /daniel/i.test(x.name) && /en[-_]GB/i.test(x.lang)) || all.find(x => /daniel/i.test(x.name)) || all.find(x => /en[-_]GB/i.test(x.lang)) || null;
}
function voices(){ return (window.speechSynthesis ? speechSynthesis.getVoices() : []).filter(v => /^en/i.test(v.lang)); }
function fillVoices(){
  const sel = $('vc'), cur = (pickVoice() || {}).voiceURI || '';
  sel.innerHTML = '<option value="">Default</option>';
  voices().forEach(v => { const o = document.createElement('option'); o.value = v.voiceURI; o.textContent = v.name + ' (' + v.lang + ')'; if (v.voiceURI === cur) o.selected = true; sel.appendChild(o); });
}
if (window.speechSynthesis) speechSynthesis.onvoiceschanged = fillVoices;
let heardNow = false, live = false, busy = false, sayId = 0, pend = 0, fin = true, ttsEnd = 0, ttsUnlocked = false;
function unlockSpeech(){
  if (ttsUnlocked || !window.speechSynthesis) return;
  ttsUnlocked = true;
  try { const u = new SpeechSynthesisUtterance('.'); u.volume = 0; speechSynthesis.speak(u); } catch(e){}
}
['touchstart', 'click', 'keydown'].forEach(ev => document.addEventListener(ev, unlockSpeech, { passive:true }));
function done(id){ if (id !== sayId) return; document.body.classList.remove('talk'); busy = false; if (live && !rec){ meterOn(); setTimeout(listen, 250); } }
function speechStart(){ sayId++; pend = 0; fin = false; ttsEnd = 0; if (live) meterOff(); if (window.speechSynthesis) speechSynthesis.cancel(); return sayId; }
function speechChunk(text, id){
  text = text.trim();
  if (!text || !window.speechSynthesis || id !== sayId) return;
  const u = new SpeechSynthesisUtterance(text.slice(0, 400));
  u.lang = 'en-GB'; u.rate = 1.05;
  const v = pickVoice();
  if (v){ u.voice = v; u.lang = v.lang; }
  pend++;
  const startAt = Math.max(Date.now(), ttsEnd); ttsEnd = startAt + text.length * 85 + 800;
  let fired = false;
  const finish = () => { if (fired || id !== sayId) return; fired = true; clearTimeout(to); pend--; if (pend <= 0 && fin) done(id); };
  const to = setTimeout(finish, ttsEnd - Date.now() + 2500);
  u.onend = u.onerror = finish;
  document.body.classList.add('talk');
  try { speechSynthesis.resume(); } catch(_){}
  speechSynthesis.speak(u);
}
function speechEnd(id){ if (id !== sayId) return; fin = true; if (pend <= 0) done(id); }
function say(text){ const id = speechStart(); speechChunk(text.replace(/[*_#`]/g, ''), id); speechEnd(id); }

/* ---------- AI calls ---------- */
const BASE_SYSTEM = 'You are Jarvis, a refined, concise personal assistant. Address the user as "sir". Reply in English, in at most three short sentences unless asked for more. Plain text only, no markdown, no lists.';


/* ---------- Clock, memory ---------- */
function nowText(){
  const d = new Date();
  return d.toLocaleString('en-GB', { weekday:'long', day:'numeric', month:'long', year:'numeric', hour:'2-digit', minute:'2-digit', hour12:false }) + ' (' + Intl.DateTimeFormat().resolvedOptions().timeZone + ')';
}
function facts(){ try { return JSON.parse(store.get('facts','[]')); } catch(e){ return []; } }
function saveFacts(a){ store.set('facts', JSON.stringify(a.slice(-60))); }
function sysPrompt(){
  const f = facts();
  return BASE_SYSTEM + ' The current date and time right now is ' + nowText() + '. Use this exact clock for any question about the day, date or time; never guess it.' + (f.length ? ' Known facts about the user, to use naturally when relevant: ' + f.join('; ') + '.' : '');
}

function genCfg(m, max){
  const g = { maxOutputTokens: max || 500 };
  if (/gemini-2\.5-flash/.test(m)) g.thinkingConfig = { thinkingBudget: 0 };
  return g;
}
function gBody(q, model, extra){
  const contents = history.concat([{ role:'user', text:(extra ? extra + '\n\nQuestion: ' : '') + q }]).map(m => ({ role: m.role === 'user' ? 'user' : 'model', parts:[{ text:m.text }] }));
  return JSON.stringify({ systemInstruction:{ parts:[{ text:sysPrompt() }] }, contents, generationConfig: genCfg(model) });
}
async function askGemini(q, extra){
  const c = cfg();
  const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(c.gm) + ':generateContent?key=' + encodeURIComponent(c.gk), {
    method:'POST', headers:{'Content-Type':'application/json'}, body: gBody(q, c.gm, extra)
  });
  const j = await r.json();
  if (!r.ok) throw new Error((j.error && j.error.message) || 'Gemini error');
  return j.candidates[0].content.parts.map(p => p.text || '').join('');
}
async function streamGemini(q, cb, model, extra){
  const c = cfg();
  const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(model) + ':streamGenerateContent?alt=sse&key=' + encodeURIComponent(c.gk), {
    method:'POST', headers:{'Content-Type':'application/json'}, body: gBody(q, model, extra)
  });
  if (!r.ok){ let m = 'Gemini error'; try { const j = await r.json(); m = (j.error && j.error.message) || m; } catch(_){} throw new Error(m); }
  const rd = r.body.getReader(), dec = new TextDecoder();
  let buf = '', all = '';
  for (;;){
    const { done, value } = await rd.read(); if (done) break;
    buf += dec.decode(value, { stream:true });
    let i;
    while ((i = buf.indexOf('\n')) >= 0){
      const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
      if (!line.startsWith('data:')) continue;
      try {
        const j = JSON.parse(line.slice(5));
        const t = ((j.candidates && j.candidates[0] && j.candidates[0].content && j.candidates[0].content.parts) || []).map(p => p.text || '').join('');
        if (t){ all += t; cb(all); }
      } catch(_){}
    }
  }
  return all;
}
async function askOpenAI(q, hist, extra){
  const c = cfg(); hist = hist || history;
  const messages = [{ role:'system', content:sysPrompt() }].concat(hist.map(m => ({ role: m.role === 'user' ? 'user' : 'assistant', content:m.text })), [{ role:'user', content:(extra ? extra + '\n\nQuestion: ' : '') + q }]);
  const r = await fetch('https://api.openai.com/v1/chat/completions', {
    method:'POST', headers:{'Content-Type':'application/json', 'Authorization':'Bearer ' + c.ok},
    body: JSON.stringify({ model:c.om, messages })
  });
  const j = await r.json();
  if (!r.ok) throw new Error((j.error && j.error.message) || 'OpenAI error');
  return j.choices[0].message.content;
}
async function referee(q, a, b){
  // Gemini judges which answer is stronger: returns "A" or "B"
  const c = cfg();
  const prompt = 'Question: ' + q + '\n\nAnswer A:\n' + a + '\n\nAnswer B:\n' + b + '\n\nWhich answer is more accurate and helpful? Reply with the single letter A or B.';
  try {
    const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(c.gm) + ':generateContent?key=' + encodeURIComponent(c.gk), {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ contents:[{ role:'user', parts:[{ text:prompt }] }], generationConfig: genCfg(c.gm, 8) })
    });
    const j = await r.json();
    return /B/i.test(j.candidates[0].content.parts[0].text) ? 'B' : 'A';
  } catch(e){ return 'A'; }
}

function cleanSpeech(t){ return t.replace(/[*_#`]/g, ''); }
async function thinkStream(q, extra){
  const c = cfg(), wait = add('sys', 'Thinking…'), id = speechStart();
  let el = null, tn = null, full = '', spoken = 0;
  const flush = final => {
    const rest = full.slice(spoken);
    if (final){ if (rest.trim()) speechChunk(cleanSpeech(rest), id); spoken = full.length; return; }
    const m = rest.match(/^[\s\S]*[.!?](?=\s)/);
    if (m){ spoken += m[0].length; speechChunk(cleanSpeech(m[0]), id); }
  };
  const onText = all => {
    if (!el){ wait.remove(); el = add('ai', '', 'Gemini'); tn = document.createTextNode(''); el.insertBefore(tn, el.firstChild); }
    full = all; tn.data = all; log.scrollTop = log.scrollHeight; flush(false);
  };
  try {
    try { await streamGemini(q, onText, c.gm, extra); }
    catch (err){
      if (full) throw err;
      await streamGemini(q, onText, c.gm === 'gemini-3.5-flash-lite' ? 'gemini-3.6-flash' : 'gemini-3.5-flash-lite', extra);
    }
    if (!full.trim()) throw new Error('No answer came back. Please try again.');
    flush(true); speechEnd(id);
    const prior = history.slice();
    history.push({ role:'user', text:q }, { role:'ai', text:full });
    history = history.slice(-12);
    if (c.ok){
      const b = document.createElement('button');
      b.className = 'alt'; b.textContent = 'Not convinced';
      b.onclick = async () => {
        b.remove();
        const w = add('sys', 'Asking ChatGPT…');
        try { const a = await askOpenAI(q, prior, extra); w.remove(); add('ai', a, 'ChatGPT'); say(a); }
        catch(e){ w.remove(); add('ai', 'My apologies, sir. ' + e.message); }
      };
      el.appendChild(b);
    }
  } catch(e){
    wait.remove();
    add('ai', 'My apologies, sir. ' + e.message);
    say('My apologies, sir. Something went wrong.');
  }
}

async function think(q, extra){
  const c = cfg();
  if (!c.gk && !c.ok){ const m = 'Sir, I need at least one API key. Tap Settings to add it.'; add('ai', m); say(m); return; }
  if (c.gk && (store.get('mode','fast') !== 'best' || !c.ok)) return thinkStream(q, extra);
  const wait = add('sys', 'Thinking…');
  try {
    let best, other, bestName, otherName;
    if (c.gk && c.ok){
      const [g, o] = await Promise.allSettled([askGemini(q, extra), askOpenAI(q, null, extra)]);
      if (g.status === 'rejected' && o.status === 'rejected') throw g.reason;
      if (g.status === 'rejected'){ best = o.value; bestName = 'ChatGPT'; }
      else if (o.status === 'rejected'){ best = g.value; bestName = 'Gemini'; }
      else {
        const pick = await referee(q, g.value, o.value);
        if (pick === 'A'){ best = g.value; bestName = 'Gemini'; other = o.value; otherName = 'ChatGPT'; }
        else { best = o.value; bestName = 'ChatGPT'; other = g.value; otherName = 'Gemini'; }
      }
    } else if (c.gk){ best = await askGemini(q, extra); bestName = 'Gemini'; }
    else { best = await askOpenAI(q, null, extra); bestName = 'ChatGPT'; }
    wait.remove();
    const el = add('ai', best, bestName);
    if (other){
      const b = document.createElement('button');
      b.className = 'alt'; b.textContent = 'Not convinced';
      b.onclick = () => { b.remove(); add('ai', other, otherName); say(other); };
      el.appendChild(b);
    }
    history.push({ role:'user', text:q }, { role:'ai', text:best });
    history = history.slice(-12);
    say(best);
  } catch(e){
    wait.remove();
    const m = 'My apologies, sir. ' + e.message;
    add('ai', m); say('My apologies, sir. Something went wrong.');
  }
}


/* ---------- Live weather (Open-Meteo, no key needed) ---------- */
const WMO = { 0:'clear sky',1:'mostly clear',2:'partly cloudy',3:'overcast',45:'foggy',48:'foggy',51:'light drizzle',53:'drizzle',55:'heavy drizzle',61:'light rain',63:'rain',65:'heavy rain',71:'light snow',73:'snow',75:'heavy snow',80:'rain showers',81:'rain showers',82:'violent showers',95:'thunderstorms',96:'thunderstorms with hail',99:'thunderstorms with hail' };
function getPos(){
  return new Promise((ok, no) => {
    const c = store.get('pos','');
    if (!navigator.geolocation){ c ? ok(JSON.parse(c)) : no(new Error('Location is unavailable.')); return; }
    navigator.geolocation.getCurrentPosition(
      p => { const o = { lat:p.coords.latitude, lon:p.coords.longitude }; store.set('pos', JSON.stringify(o)); ok(o); },
      () => { c ? ok(JSON.parse(c)) : no(new Error('I need location access to check the weather, sir. Allow it for Safari, or ask me with a city name.')); },
      { timeout:8000, maximumAge:600000 });
  });
}
async function geocode(city){
  const r = await fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&name=' + encodeURIComponent(city));
  const j = await r.json();
  if (!j.results || !j.results.length) throw new Error('I could not find a place called ' + city + ', sir.');
  return { lat:j.results[0].latitude, lon:j.results[0].longitude, name:j.results[0].name };
}
async function weatherFor(q){
  const m = q.match(/\b(?:in|for|at)\s+([A-Z][\p{L}'. -]{2,30})/u);
  const city = m ? m[1].trim().replace(/\s+(today|tomorrow|tonight|this|next|now|please)\b.*$/i, '') : '';
  const pos = city ? await geocode(city) : await getPos();
  const u = 'https://api.open-meteo.com/v1/forecast?latitude=' + pos.lat + '&longitude=' + pos.lon + '&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=7';
  const j = await (await fetch(u)).json();
  const c = j.current, d = j.daily;
  const days = d.time.map((t, i) => new Date(t + 'T12:00').toLocaleDateString('en-GB', { weekday:'long' }) + ': ' + (WMO[d.weather_code[i]] || 'mixed') + ', ' + Math.round(d.temperature_2m_min[i]) + ' to ' + Math.round(d.temperature_2m_max[i]) + ' degrees Celsius, ' + d.precipitation_probability_max[i] + '% chance of rain');
  return 'Place: ' + (pos.name || 'the user\'s location') + '. Now: ' + (WMO[c.weather_code] || 'mixed') + ', ' + Math.round(c.temperature_2m) + ' degrees Celsius, feels like ' + Math.round(c.apparent_temperature) + ', wind ' + Math.round(c.wind_speed_10m) + ' km/h. Forecast, starting today: ' + days.join('. ') + '.';
}
const isWeather = q => /\b(weather|forecast|temperature|rain|raining|umbrella|snow|sunny|cold outside|hot outside)\b/i.test(q);

/* ---------- Reminders (work while this page is open) ---------- */
function parseReminder(q){
  const m = q.match(/remind me (?:in|after) (\d+|an?|one) (second|minute|hour)s?(?: to | about )?(.*)/i);
  if (!m) return null;
  const n = /^\d+$/.test(m[1]) ? parseInt(m[1], 10) : 1;
  const ms = n * { second:1000, minute:60000, hour:3600000 }[m[2].toLowerCase()];
  return { ms, what: (m[3] || 'your reminder').trim(), label: n + ' ' + m[2].toLowerCase() + (n > 1 ? 's' : '') };
}
function setReminder(r){
  setTimeout(() => {
    const msg = 'Sir, a reminder: ' + r.what;
    add('ai', msg); say(msg);
    try { if ('Notification' in window && Notification.permission === 'granted') new Notification('Jarvis', { body:r.what }); } catch(e){}
  }, r.ms);
  const m = 'Very good, sir. I will remind you in ' + r.label + ' to ' + r.what + '. Keep this page open until then.';
  add('ai', m); say(m);
  try { if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission(); } catch(e){}
}

/* ---------- Input ---------- */
function reply(m){ add('ai', m); say(m); }
function submit(q){
  q = q.trim(); if (!q) return;
  busy = true;
  add('me', q); txt.value = '';
  const low = q.toLowerCase();
  let m;
  if ((m = q.match(/^(?:please\s+)?remember(?: that)?\s+(.+)/i))){
    const a = facts(); a.push(m[1].replace(/[.!]+$/, '')); saveFacts(a);
    return reply('Very good, sir. I have noted that.');
  }
  if ((m = q.match(/^(?:please\s+)?forget(?: that)?\s+(.+)/i))){
    const w = m[1].toLowerCase().replace(/[.!]+$/, ''), a = facts(), keep = a.filter(f => !f.toLowerCase().includes(w));
    saveFacts(keep);
    return reply(keep.length < a.length ? 'Done, sir. It has been erased.' : 'I found nothing matching that, sir.');
  }
  if (/\bwhat(?:'s| is| was)?\s+(?:the\s+)?(time|date|day)\b|\bwhat time is it\b|\bwhat day is (?:it|today)\b|\btoday'?s date\b|\bcurrent (?:time|date)\b/i.test(low) && !/\b(tomorrow|yesterday|in |on |next|last)\b/.test(low)){
    const d = new Date(), t = d.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit', hour12:false }), dt = d.toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
    return reply(/\btime\b/.test(low) && !/\b(date|day)\b/.test(low) ? 'It is ' + t + ', sir.' : 'It is ' + dt + ', sir, and the time is ' + t + '.');
  }
  const r = parseReminder(q);
  if (r) return setReminder(r);
  if (isWeather(q)){
    const w = add('sys', 'Checking the forecast…');
    weatherFor(q).then(info => { w.remove(); think(q, 'Live weather data (use only this, answer in two or three short sentences, say temperatures in degrees Celsius): ' + info); })
      .catch(e => { w.remove(); reply(e.message || 'I could not reach the weather service, sir.'); });
    return;
  }
  think(q);
}
$('send').onclick = () => submit(txt.value);
txt.addEventListener('keydown', e => { if (e.key === 'Enter') submit(txt.value); });

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
function listen(){
  if (!live || busy || rec || !SR) return;
  const r = rec = new SR();
  r.lang = 'en-US'; r.interimResults = true; r.continuous = false;
  let heard = '', sent = false, timer = null;
  const send = () => { clearTimeout(timer); const q = heard.trim(); if (sent || !q || !live) return; sent = true; txt.value = ''; submit(q); };
  r.onresult = e => {
    heard = Array.from(e.results).map(x => x[0].transcript).join(' ');
    heardNow = true; clearTimeout(window._hn); window._hn = setTimeout(() => { heardNow = false; }, 700);
    txt.value = heard;
    clearTimeout(timer);
    if (e.results[e.results.length - 1].isFinal) send();
    else timer = setTimeout(() => { try { r.stop(); } catch(_){} }, 1000);
  };
  r.onerror = e => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed'){ stopLive(); add('sys', 'Microphone access was denied, sir. Allow it in Safari settings.'); }
    else if (e.error !== 'no-speech' && e.error !== 'aborted') add('sys', 'Microphone issue: ' + e.error);
  };
  r.onend = () => { clearTimeout(timer); if (rec === r) rec = null; send(); if (live && !busy) setTimeout(listen, 200); };
  try { r.start(); } catch(_){ rec = null; if (live) setTimeout(listen, 500); }
}
function stopLive(){
  live = false; busy = false; sayId++; heardNow = false; clearTimeout(window._hn);
  $('mic').classList.remove('on'); document.body.classList.remove('live', 'talk');
  $('vm').classList.remove('open'); meterOff();
  const r = rec; rec = null;
  if (r){ r.onresult = r.onerror = r.onend = null; try { r.abort(); } catch(e){} }
  if (window.speechSynthesis) speechSynthesis.cancel();
}
async function startLive(){
  unlockSpeech();
  if (!SR){ add('sys', 'Voice input is not available here, sir. Open Jarvis in Safari, or use the keyboard microphone.'); return; }
  try {
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia){
      const st = await navigator.mediaDevices.getUserMedia({ audio:true });
      st.getTracks().forEach(t => t.stop());
    }
  } catch(e){ add('sys', 'Microphone access was denied, sir. Allow it in Safari settings, then reload the page.'); return; }
  live = true; busy = false;
  $('mic').classList.add('on'); document.body.classList.add('live'); $('vm').classList.add('open');
  meterOn();
  setTimeout(listen, 350);
}
function toggleLive(){ if (live){ stopLive(); } else startLive(); }
$('mic').onclick = toggleLive;
$('vm').onclick = e => { if (e.target.id === 'vm' || e.target.closest('#vmx') || e.target.closest('#vmic')) stopLive(); };


/* ---------- Voice screen: live mic level ---------- */
let lvl = 0, meterCtx = null, meterAn = null, meterStream = null;
let meterBusy = false;
async function meterOn(){
  if (meterAn || meterBusy || !navigator.mediaDevices) return;
  meterBusy = true;
  try {
    const st = await navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:true, noiseSuppression:true } });
    if (!live || pend > 0 || document.body.classList.contains('talk')){ st.getTracks().forEach(t => t.stop()); return; }
    meterStream = st;
    const AC = window.AudioContext || window.webkitAudioContext;
    meterCtx = new AC();
    try { if (meterCtx.state === 'suspended') meterCtx.resume(); } catch(e){}
    const src = meterCtx.createMediaStreamSource(meterStream);
    meterAn = meterCtx.createAnalyser(); meterAn.fftSize = 256; src.connect(meterAn);
  } catch(e){ meterAn = null; } finally { meterBusy = false; }
}
function meterOff(){
  try { if (meterStream) meterStream.getTracks().forEach(t => t.stop()); if (meterCtx) meterCtx.close(); } catch(e){}
  meterStream = meterCtx = meterAn = null; lvl = 0;
}
(function tick(){
  const vm = $('vm');
  if (vm.classList.contains('open')){
    let raw = 0;
    if (meterAn){
      const d = new Uint8Array(meterAn.fftSize); meterAn.getByteTimeDomainData(d);
      let sum = 0; for (let i = 0; i < d.length; i++){ const x = (d[i] - 128) / 128; sum += x * x; }
      raw = Math.min(1, Math.sqrt(sum / d.length) * 7);
    }
    const talking = document.body.classList.contains('talk');
    if (talking) raw = .35 + .45 * Math.abs(Math.sin(Date.now() / 140));
    lvl += (raw - lvl) * .35;
    vm.style.setProperty('--lvl', lvl.toFixed(3));
    const hear = !talking && raw > .12, think = busy && !talking;
    vm.classList.toggle('hear', hear); vm.classList.toggle('speak', talking); vm.classList.toggle('think', think);
    $('vmt').textContent = talking ? 'Speaking' : think ? 'Thinking' : hear ? 'Listening' : 'Go ahead, sir';
  }
  requestAnimationFrame(tick);
})();

setInterval(() => { if (live && !busy && !rec && !document.hidden){ meterOn(); listen(); } }, 1500);
document.addEventListener('visibilitychange', () => { if (!document.hidden && live && !busy && !rec) setTimeout(listen, 300); });

/* ---------- Settings ---------- */
$('cfg').onclick = () => { const c = cfg(); $('gk').value = c.gk; $('ok').value = c.ok; $('gm').value = c.gm; $('om').value = c.om; $('md').value = store.get('mode','fast'); $('mem').value = facts().join('\n'); fillVoices(); dlg.showModal(); };
$('cancel').onclick = () => dlg.close();
$('test').onclick = () => { store.set('voice', $('vc').value); say('Good day, sir. How do I sound?'); };
$('save').onclick = () => { store.set('gk', $('gk').value.trim()); store.set('ok', $('ok').value.trim()); store.set('gm', $('gm').value.trim()); store.set('om', $('om').value.trim()); store.set('voice', $('vc').value); store.set('mode', $('md').value); saveFacts($('mem').value.split('\n').map(x => x.trim()).filter(Boolean)); dlg.close(); add('sys', 'Settings saved.'); };

/* ---------- Living background ---------- */
(function(){
  const cv = $('hud'), g = cv.getContext('2d'), cv2 = $('hudt'), h = cv2.getContext('2d');

  const parts = Array.from({ length: 12 }, () => ({ r: .37 + Math.random() * .57, a: Math.random() * 6.283, v: (.15 + Math.random() * .5) * (Math.random() < .5 ? -1 : 1), s: .8 + Math.random() * 1.8, p: Math.random() * 6 }));
  const ripples = [];
  const bok = Array.from({ length: 14 }, () => ({ x: Math.random(), y: Math.random(), vx: (Math.random() - .5) * .012, vy: (Math.random() - .5) * .01, r: .05 + Math.random() * .14, a: .07 + Math.random() * .11, p: Math.random() * 6.283 }));
  let memN = 0, memT = -9;

  let env = [.5, .5, .5], envG = [.5, .5, .5];

  function frame(ms){
    const t = ms / 1000, dt = Math.min(.05, t - last) || .016; last = t;
    const talking = document.body.classList.contains('talk'), thinking = busy && !talking;
    e += ((talking ? 1 : thinking ? .65 : live ? .4 : .14) - e) * Math.min(1, dt * 3);
    const tc = thinking ? [255, 180, 84] : [111, 211, 255];
    for (let i = 0; i < 3; i++) col[i] += (tc[i] - col[i]) * Math.min(1, dt * 3);
    warm += ((thinking ? 1 : 0) - warm) * Math.min(1, dt * 3);
    voiceAmt += (((talking || live) ? 1 : 0) - voiceAmt) * Math.min(1, dt * 4);
    spin += dt * (.1 + e * .5);
    envT += dt;
    if (envT > .09){ envT = 0; envG = envG.map(() => talking ? Math.random() : .5 + Math.random() * .3); }
    env = env.map((v, i) => v + (envG[i] - v) * Math.min(1, dt * 14));

    const cx = W / 2, cy = H * .47, S = Math.min(H * .46, W * .8), TAU = Math.PI * 2;
    g.clearRect(0, 0, W, H);
    g.globalCompositeOperation = 'lighter';
    g.lineCap = 'round';

    // drifting bokeh orbs
    bok.forEach(b => {
      const x = ((b.x + t * b.vx) % 1 + 1) % 1 * W, y = ((b.y + t * b.vy) % 1 + 1) % 1 * H;
      const rr = S * b.r * (1 + .12 * Math.sin(t * .5 + b.p)), a = b.a * (.65 + .35 * Math.sin(t * .7 + b.p)) * (.7 + e * .6);
      const gg = g.createRadialGradient(x, y, 0, x, y, rr);
      gg.addColorStop(0, rgba(a)); gg.addColorStop(1, rgba(0));
      g.fillStyle = gg; g.beginPath(); g.arc(x, y, rr, 0, TAU); g.fill();
    });

    // core glow
    const pulse = 1 + Math.sin(t * (1.6 + e * 4)) * .07 * (.5 + e);
    const gr = g.createRadialGradient(cx, cy, 0, cx, cy, S * .32 * pulse);
    gr.addColorStop(0, rgba(.3 * (.5 + e * .5))); gr.addColorStop(1, rgba(0));
    g.fillStyle = gr; g.beginPath(); g.arc(cx, cy, S * .32 * pulse, 0, TAU); g.fill();

    // steady orb: Siri-style fluid core inside an arc-reactor frame
    const oR = S * .3, mix = c => [c[0] + (255 - c[0]) * warm, c[1] + (150 - c[1]) * warm, c[2] + (50 - c[2]) * warm].map(Math.round);
    g.save();
    g.beginPath(); g.arc(cx, cy, oR * .8, 0, TAU); g.clip();
    g.globalCompositeOperation = 'source-over';
    g.fillStyle = 'rgba(4,12,22,.92)'; g.fillRect(cx - oR, cy - oR, oR * 2, oR * 2);
    g.globalCompositeOperation = 'lighter';
    [[[90, 220, 255], .25, 0, .22, .18, .7], [[110, 150, 255], -.2, 3, .2, .2, .6]].forEach(([c, sp, ph, rx, ry, sz]) => {
      const cc = mix(c), x = cx + Math.cos(t * sp + ph) * oR * rx, y = cy + Math.sin(t * sp * 1.2 + ph) * oR * ry, rad = oR * sz;
      const bg = g.createRadialGradient(x, y, 0, x, y, rad);
      bg.addColorStop(0, 'rgba(' + cc + ',' + (.45 + .1 * voiceAmt) + ')'); bg.addColorStop(1, 'rgba(' + cc + ',0)');
      g.fillStyle = bg; g.beginPath(); g.arc(x, y, rad, 0, TAU); g.fill();
    });
    // subtle waveform, only visible while someone speaks
    if (voiceAmt > .01){
      const lv = talking ? .3 + .7 * env[0] : Math.min(1, Math.max(0, lvl - .06) * 2.1), sv = talking ? 1.9 : 1 + lv * 1.2, amp = oR * (.015 + .42 * lv) * voiceAmt * (talking ? 1 + .22 * Math.sin(t * 9) : 1), wl = [[.55, 3, 1.1, .8], [.4, 5, -1.6, .45], [.3, 8, 2.2, .3]];
      wl.forEach(([w, f, sp, al], k) => {
        g.beginPath();
        for (let i = 0; i <= 60; i++){
          const u = i / 60, x = cx - oR * .72 + u * oR * 1.44, tap = Math.sin(u * Math.PI);
          const y = cy + (Math.sin(u * TAU * f * .5 + t * sp * 3 * sv + k) + .35 * Math.sin(u * TAU * f * .8 - t * sp * 4.5 * sv)) * amp * w * tap * (.55 + .5 * env[(k + 1) % 3]);

      });
    }
    const hl = g.createRadialGradient(cx, cy, 0, cx, cy, oR * .3);
    hl.addColorStop(0, 'rgba(255,255,255,' + (.36 + .1 * voiceAmt + .04 * Math.sin(t * 2)) + ')'); hl.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = hl; g.beginPath(); g.arc(cx, cy, oR * .3, 0, TAU); g.fill();
    g.restore();
    g.lineCap = 'butt'; g.lineWidth = oR * .1; g.strokeStyle = rgba(.4);
    for (let j = 0; j < 10; j++){ const st = spin * .04 + j * TAU / 10; g.beginPath(); g.arc(cx, cy, oR * .9, st, st + TAU / 10 * .7); g.stroke(); }
    g.lineCap = 'round';
    g.lineWidth = 2; g.strokeStyle = rgba(.75); g.beginPath(); g.arc(cx, cy, oR * .8, 0, TAU); g.stroke();
    g.lineWidth = 2.5; g.strokeStyle = rgba(.9); g.beginPath(); g.arc(cx, cy, oR, 0, TAU); g.stroke();
    g.lineWidth = 1; g.strokeStyle = rgba(.35); g.beginPath(); g.arc(cx, cy, oR * 1.14, 0, TAU); g.stroke();

    // rotating arc rings

      g.lineWidth = w; g.strokeStyle = rgba(al * .35 * (.6 + e * .4));

      }
    });

    // orbiting particles

      p.a += p.v * dt * (1 + e * 2.2);
      const rr = S * p.r * (1 + .03 * Math.sin(t + p.p)), sg = Math.sign(p.v);
      g.lineWidth = .8; g.strokeStyle = rgba(.12);
      g.beginPath(); g.arc(cx, cy, rr, p.a - sg * .14, p.a, sg < 0); g.stroke();
      g.fillStyle = rgba(.4); g.beginPath(); g.arc(cx + Math.cos(p.a) * rr, cy + Math.sin(p.a) * rr, p.s, 0, TAU); g.fill();
    });

    // ripples from the core
    rip += dt;
    if (rip > (talking ? 1.4 : thinking ? 2.2 : live ? 4 : 8)){ rip = 0; ripples.push({ r: S * .34, a: .22 }); }
    for (let i = ripples.length - 1; i >= 0; i--){
      const q = ripples[i]; q.r += dt * S * (.5 + e * .5); q.a -= dt * .35;
      if (q.a <= 0 || q.r > S * 1.1){ ripples.splice(i, 1); continue; }
      g.lineWidth = 1; g.strokeStyle = rgba(q.a); g.beginPath(); g.arc(cx, cy, q.r, 0, TAU); g.stroke();
    }

    // title and meaning of the name, above the orb
    {
      h.clearRect(0, 0, W, H);
      h.globalCompositeOperation = 'source-over';
      {
        h.font = '9px "Courier New", monospace'; h.textAlign = 'center';
        const cols = [10, 23, W - 23, W - 10], rows = Math.ceil(H / 11), glyph = '01ABCDEF<>/{}=+';
        cols.forEach((x, ci) => {
          const head = (t * (5 + ci * 1.7) + ci * 13) % (rows + 16);

        [[14, cy - S * .62, 'left', 'SYSTEM', st], [W - 14, cy - S * .62, 'right', 'CLOCK', new Date().toLocaleTimeString('en-GB'), new Date().toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short', year:'numeric' }).toUpperCase().replace(/,/g, '')],
         [14, cy + S * .5, 'left', 'MEMORY', memN + ' FACTS'], [W - 14, cy + S * .5, 'right', 'NETWORK', navigator.onLine ? 'ONLINE' : 'OFFLINE']].forEach(([x, y, al, lab, val, sub]) => {

          h.font = '600 9px Rajdhani, "Courier New", monospace'; h.fillStyle = rgba(.2); h.fillText(lab, x, y);
          h.font = '700 12px Rajdhani, "Courier New", monospace'; h.fillStyle = rgba(.42); h.fillText(val, x, y + 13);
          if (sub){ h.font = '600 10px Rajdhani, "Courier New", monospace'; h.fillStyle = rgba(.3); h.fillText(sub, x, y + 25); }
        });

      h.fillStyle = 'rgba(230,243,251,.95)';

      h.save();
